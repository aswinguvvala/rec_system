# Base dark "streaming service" theme for the native Streamlit widgets (toolbar
# selects/sliders/checkboxes, dataframe, buttons). Bespoke elements -- the navbar,
# hero, poster cards, and shelves -- are layered on top via CSS injected from
# app.py. Setting the theme here (the officially supported mechanism) rather than
# fighting every widget's internal class name in CSS keeps native widgets
# consistent across Streamlit versions.
[theme]
base = "dark"
primaryColor = "#e50914"
backgroundColor = "#141414"
secondaryBackgroundColor = "#1f1f1f"
textColor = "#f5f5f1"
font = "sans serif"
